plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

group = 'rgd.mcw.edu'

String appName = 'ontomate-tools'

repositories {
    mavenCentral()
}

dependencies {

    /* =========================
       Testing
       ========================= */
    testImplementation 'junit:junit:4.13.2'

    /* =========================
       Custom JARs (gate, gnat – not on Maven Central)
       ========================= */
    implementation fileTree(dir: 'lib', include: '*.jar')

    /* =========================
       Apache Commons
       ========================= */
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.apache.commons:commons-collections4:4.5.0'
    implementation 'commons-io:commons-io:2.21.0'
    implementation 'org.apache.commons:commons-text:1.15.0'
    implementation 'org.apache.commons:commons-pool2:2.6.0'

    /* =========================
       JSON
       ========================= */
    implementation 'org.codehaus.jackson:jackson-core-asl:1.9.13'
    implementation 'org.codehaus.jackson:jackson-mapper-asl:1.9.13'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.8.7'
    implementation 'org.json:json:20200518'
    implementation 'net.sf.json-lib:json-lib:2.2:jdk13'

    /* =========================
       Solr client
       ========================= */
    implementation 'org.apache.solr:solr-solrj:8.6.2'

    /* =========================
       Web / HTML
       ========================= */
    implementation 'org.jsoup:jsoup:1.11.3'
    implementation 'com.sun.jersey:jersey-core:1.19.4'
    implementation 'com.sun.jersey:jersey-json:1.19.4'
    implementation 'com.sun.jersey:jersey-server:1.19.4'

    /* =========================
       AOP
       ========================= */
    implementation 'aopalliance:aopalliance:1.0'
    implementation 'org.aspectj:aspectjrt:1.9.2'
    implementation 'org.aspectj:aspectjtools:1.9.2'

    /* =========================
       GATE 8.4.1 runtime dependencies
       (gate.jar, gate-asm, gate-compiler-jdt are in lib/)
       ========================= */
    implementation 'org.jdom:jdom:1.1.3'
    implementation 'jaxen:jaxen:1.2.0'
    implementation 'net.sourceforge.nekohtml:nekohtml:1.9.22'
    implementation 'xerces:xercesImpl:2.12.2'
    implementation 'org.apache.ivy:ivy:2.5.2'
    implementation 'log4j:log4j:1.2.17'
    implementation 'commons-logging:commons-logging:1.2'
    implementation 'org.codehaus.woodstox:woodstox-core-lgpl:4.4.1'
    implementation 'org.codehaus.woodstox:stax2-api:3.1.4'
    implementation 'com.thoughtworks.xstream:xstream:1.4.7'
    implementation 'org.apache.lucene:lucene-core:4.2.0'
    implementation 'org.springframework:spring-core:4.3.30.RELEASE'
    implementation 'org.springframework:spring-beans:4.3.30.RELEASE'
    implementation 'org.springframework:spring-context:4.3.30.RELEASE'
    implementation 'org.springframework:spring-aop:4.3.30.RELEASE'
    implementation 'org.apache.tika:tika-core:1.17'
    implementation('org.apache.tika:tika-parsers:1.17') {
        exclude group: 'org.apache.opennlp'
    }
    implementation 'org.apache.pdfbox:pdfbox:1.8.8'
    implementation 'org.apache.pdfbox:fontbox:1.8.8'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.apache.httpcomponents:httpcore:4.4.16'
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'
    implementation 'org.xhtmlrenderer:flying-saucer-core:9.0.4'

    /* =========================
       Misc
       ========================= */
    implementation 'org.apache.james:apache-mime4j-core:0.8.13'
    implementation 'org.apache.ant:ant:1.10.15'

    /* =========================
       Logging
       ========================= */
    implementation 'org.slf4j:slf4j-api:1.7.36'
    runtimeOnly 'org.slf4j:slf4j-simple:1.7.36'

    /* =========================
       Hadoop – EMR provides these at runtime
       ========================= */
    compileOnly("org.apache.hadoop:hadoop-client:3.4.1")
    compileOnly("org.apache.hadoop:hadoop-mapreduce-client-core:3.4.1")
    compileOnly("org.apache.hadoop:hadoop-mapreduce-client-jobclient:3.4.1")

    /* =========================
       HBase – shaded JAR bundles HBase with relocated
       dependencies to avoid protobuf/guava conflicts on EMR
       ========================= */
    compileOnly("org.apache.hbase:hbase-shaded-mapreduce:2.6.2")
    compileOnly("org.apache.hbase:hbase-server:2.6.2") // for ConstantSizeRegionSplitPolicy

}

shadowJar {
    archiveBaseName.set(appName)
    archiveVersion.set(version)
    archiveClassifier.set('')
    zip64 = true
    mergeServiceFiles()

    // No Main-Class so each EMR step can specify its own main class
    // as the first argument: hadoop jar <jar> <mainClass> <args...>
    manifest {
    attributes.remove('Main-Class')
        attributes(
                'Built-By': System.getProperty('user.name'),
                'Built-JDK': System.getProperty('java.version'),
                'Built-Date': new Date(),
        )
    }
}

