group 'rgd.mcw.edu'
version ''

apply plugin: 'java'
apply plugin: 'application'

sourceCompatibility = 17
mainClassName='edu.mcw.rgd.nlp.utils.ncbi.DistributedAnnotator'
String appName='ontomate-tools-pmc'
repositories {
    mavenCentral()
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.11'
    implementation fileTree(dir: 'lib', include: '*.jar')
    implementation group: 'org.apache.james', name: 'apache-mime4j-core', version: '0.8.13'

    // Source: https://mvnrepository.com/artifact/org.apache.ant/ant
    implementation("org.apache.ant:ant:1.10.15")

// Source: https://mvnrepository.com/artifact/org.springframework/spring-aop
    implementation("org.springframework:spring-aop:6.2.15")
    // Source: https://mvnrepository.com/artifact/org.springframework/spring-core
    implementation("org.springframework:spring-core:6.2.15")
    // Source: https://mvnrepository.com/artifact/org.springframework/spring-beans
    implementation("org.springframework:spring-beans:6.2.15")


    implementation group: 'aopalliance', name: 'aopalliance', version: '1.0'
    //  implementation group: 'org.ow2.asm', name: 'asm', version: '7.0'
    implementation group: 'org.aspectj', name: 'aspectjrt', version: '1.9.2'
    implementation group: 'org.aspectj', name: 'aspectjtools', version: '1.9.2'

    implementation group: 'org.apache.commons', name: 'commons-math3', version: '3.6.1'
// Source: https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation("org.apache.commons:commons-lang3:3.20.0")
// Source: https://mvnrepository.com/artifact/org.apache.commons/commons-collections4
    implementation("org.apache.commons:commons-collections4:4.5.0")

// Source: https://mvnrepository.com/artifact/commons-io/commons-io
    implementation("commons-io:commons-io:2.21.0")

    implementation group: 'org.apache.commons', name: 'commons-pool2', version: '2.6.0'
// Source: https://mvnrepository.com/artifact/org.apache.commons/commons-text
    implementation("org.apache.commons:commons-text:1.15.0")


    implementation group: 'org.apache.ws.commons.axiom', name: 'axiom-api', version: '1.2.21'
    implementation group: 'org.apache.ws.commons.axiom', name: 'axiom-impl', version: '1.2.21'
    implementation group: 'org.apache.axis2', name: 'axis2', version: '1.7.9'
    implementation group: 'org.apache.axis2', name: 'axis2-transport-http', version: '1.7.9'
    implementation group: 'org.apache.axis2', name: 'axis2-transport-local', version: '1.7.9'
    implementation group: 'org.apache.axis2', name: 'axis2-kernel', version: '1.7.9'
    implementation group: 'org.apache.axis2', name: 'axis2-codegen', version: '1.7.9'
    // implementation group: 'org.apache.axis2', name: 'axis2-xmlbeans', version: '1.7.9'
    implementation group: 'org.codehaus.jackson', name: 'jackson-core-asl', version: '1.9.13'
    implementation group: 'org.codehaus.jackson', name: 'jackson-mapper-asl', version: '1.9.13'
//    implementation group: 'tomcat', name: 'jasper-implementationr', version: '5.5.23'
//    implementation group: 'tomcat', name: 'jasper-runtime', version: '5.5.23'
    implementation group: 'org.jsoup', name: 'jsoup', version: '1.11.3'

    implementation group: 'com.sun.jersey', name: 'jersey-core', version: '1.19.4'
    implementation group: 'com.sun.jersey', name: 'jersey-json', version: '1.19.4'
    implementation group: 'com.sun.jersey', name: 'jersey-server', version: '1.19.4'



    /* implementation group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.4.1'
     implementation group: 'org.apache.httpcomponents', name: 'httpcore', version: '4.4.1'
     implementation group: 'org.apache.httpcomponents', name: 'httpmime', version: '4.4.1'*/

    implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.25'



    // Source: https://mvnrepository.com/artifact/org.apache.hbase/hbase-client
    implementation("org.apache.hbase:hbase-client:2.6.2")
// Source: https://mvnrepository.com/artifact/org.apache.hbase/hbase-server
    implementation("org.apache.hbase:hbase-server:2.6.3")
// Source: https://mvnrepository.com/artifact/org.apache.hbase/hbase-common
    implementation("org.apache.hbase:hbase-common:2.6.3")
    // Source: https://mvnrepository.com/artifact/org.apache.hbase/hbase
    implementation("org.apache.hbase:hbase:2.6.3")

// Source: https://mvnrepository.com/artifact/org.apache.hbase/hbase-prefix-tree
    runtimeOnly("org.apache.hbase:hbase-prefix-tree:1.7.2")
    // Source: https://mvnrepository.com/artifact/org.apache.hbase/hbase-zookeeper
    implementation("org.apache.hbase:hbase-zookeeper:2.6.3")
    // Source: https://mvnrepository.com/artifact/org.apache.hbase/hbase-mapreduce
    implementation("org.apache.hbase:hbase-mapreduce:2.6.3")

// Source: https://mvnrepository.com/artifact/org.apache.hbase/hbase-rest
    implementation("org.apache.hbase:hbase-rest:2.6.3")
    // Source: https://mvnrepository.com/artifact/org.apache.hbase/hbase-it
    testImplementation("org.apache.hbase:hbase-it:2.6.3")
    // Source: https://mvnrepository.com/artifact/org.apache.hbase/hbase-protocol
    implementation("org.apache.hbase:hbase-protocol:2.6.3")
// Source: https://mvnrepository.com/artifact/org.apache.hbase/hbase-hadoop-compat
    implementation("org.apache.hbase:hbase-hadoop-compat:2.6.3")
// Source: https://mvnrepository.com/artifact/org.apache.hbase/hbase-hadoop2-compat
    implementation("org.apache.hbase:hbase-hadoop2-compat:2.6.3")

// Source: https://mvnrepository.com/artifact/org.apache.hadoop/hadoop-common
    implementation("org.apache.hadoop:hadoop-common:3.4.1")
// Source: https://mvnrepository.com/artifact/org.apache.hadoop/hadoop-hdfs
    implementation("org.apache.hadoop:hadoop-hdfs:3.4.1")
// Source: https://mvnrepository.com/artifact/org.apache.hadoop/hadoop-hdfs-client
    implementation("org.apache.hadoop:hadoop-hdfs-client:3.4.1")
    //   implementation group: 'uk.ac.gate', name: 'gate-core', version: '6.1'
// Source: https://mvnrepository.com/artifact/org.apache.hadoop/hadoop-mapreduce-client-core
    implementation("org.apache.hadoop:hadoop-mapreduce-client-core:3.4.1")

// Source: https://mvnrepository.com/artifact/org.apache.hadoop/hadoop-mapreduce-client-jobclient
    implementation("org.apache.hadoop:hadoop-mapreduce-client-jobclient:3.4.1")

// Source: https://mvnrepository.com/artifact/org.apache.hadoop/hadoop-mapreduce-client-common
    implementation("org.apache.hadoop:hadoop-mapreduce-client-common:3.4.1")

// Source: https://mvnrepository.com/artifact/org.apache.hadoop/hadoop-yarn-api
    implementation("org.apache.hadoop:hadoop-yarn-api:3.4.1")
// Source: https://mvnrepository.com/artifact/org.apache.hadoop/hadoop-yarn-common
    implementation("org.apache.hadoop:hadoop-yarn-common:3.4.1")
// Source: https://mvnrepository.com/artifact/org.apache.hadoop/hadoop-yarn-client
    implementation("org.apache.hadoop:hadoop-yarn-client:3.4.1")

// Source: https://mvnrepository.com/artifact/org.apache.hadoop/hadoop-yarn-server-applicationhistoryservice
    implementation("org.apache.hadoop:hadoop-yarn-server-applicationhistoryservice:3.4.1")

// Source: https://mvnrepository.com/artifact/org.apache.hadoop/hadoop-annotations
    implementation("org.apache.hadoop:hadoop-annotations:3.4.1")
// Source: https://mvnrepository.com/artifact/org.apache.hadoop/hadoop-client
    implementation("org.apache.hadoop:hadoop-client:3.4.1")



// Source: https://mvnrepository.com/artifact/org.apache.zookeeper/zookeeper
    implementation("org.apache.zookeeper:zookeeper:3.9.4")

    implementation group: 'org.apache.solr', name: 'solr-common', version: '1.3.0'

    implementation group: 'org.slf4j', name: 'slf4j-simple', version: '1.7.25'


}


jar {
    zip64=true
    manifest {
        attributes 'Built-By': System.getProperty('user.name'),
                'Built-Date': new Date(),
                'Built-JDK': System.getProperty('java.version'),
                'Class-Path': configurations.runtimeClasspath.collect { it.getName() }.join(' '),
                'Main-Class': mainClassName

    }
//    from{
//        configurations.compile.collect{it.isDirectory()?it:zipTree(it)}
//    }

}

distributions {
    main {
        distributionBaseName = appName
    }
}